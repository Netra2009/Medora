<!DOCTYPE html>
<html lang="en">
<head>
    <title>Booking Confirmed</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #e3f2fd; }
        .success-box { background: white; padding: 40px; display: inline-block; border-radius: 10px; box-shadow: 0 4px 10px #90caf9; }
        h1 { color: #28a745; }
    </style>
</head>
<body>
    <div class="success-box">
        <h1>✅ Booking Confirmed!</h1>
        <h3>Thank you for choosing us.</h3>
        <p><b><span id="doctorName"></span></b> has accepted your request.</p>
        <p style="font-size: 18px; color: #555;">Our specialist will reach your home in a few minutes.</p>
        <br>
        <a href="/">Go to Home Page</a>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const doctor = params.get("doctor");
        document.getElementById("doctorName").innerText = doctor;

    </script>
</body>
</html>
