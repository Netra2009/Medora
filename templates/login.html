<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hospital Home Visit - Login</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #10cfec; text-align: center; padding: 50px; }
        .box { background: rgb(232, 234, 234); padding: 30px; display: inline-block; border-radius: 10px; box-shadow: 0px 0px 10px #ccc; }
        input { width: 80%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #007bff; color: rgb(229, 230, 237); padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>MEDORA</h2>
        <p>Please enter your details to find doctors near you</p>
        <form action="specialists.html" method="GET"> 
           <input type="text" name="name" placeholder="Enter Your Name" required><br> 
           <input type="tel" name="phonenumber" placeholder="Enter Phone Number" required><br> 
           <input type="text" name="address" placeholder="Enter Your Address" required><br> 
           <button type="submit">Submit & View Specialists</button> 
        </form>
    </div>
</body>
</html>
